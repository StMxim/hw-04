<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', Arial, sans-serif; background: #f7f9fa; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); padding: 32px 24px; }
        h2 { margin-top: 0; text-align: center; color: #333; }
        .status-bar { display: flex; justify-content: space-between; margin-bottom: 16px; color: #666; font-size: 15px; }
        .filters { display: flex; gap: 8px; margin-bottom: 16px; }
        .filter-btn { flex: 1; padding: 8px 0; border: none; border-radius: 5px; background: #e0e0e0; color: #333; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .filter-btn.active { background: #009688; color: #fff; }
        .add-task-row { display: flex; gap: 8px; margin-bottom: 20px; }
        .add-task-row input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
        .add-task-row button { padding: 10px 18px; background: #009688; color: #fff; border: none; border-radius: 5px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .add-task-row button:disabled { background: #b2dfdb; cursor: not-allowed; }
        .tasks-list { list-style: none; padding: 0; margin: 0; }
        .task-item { display: flex; align-items: center; background: #f4f4f4; border-radius: 6px; margin-bottom: 10px; padding: 10px 12px; transition: box-shadow 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
        .task-item.completed { opacity: 0.6; text-decoration: line-through; }
        .task-checkbox { margin-right: 12px; accent-color: #009688; width: 18px; height: 18px; }
        .task-title { flex: 1; font-size: 16px; }
        .delete-btn { background: none; border: none; color: #e53935; font-size: 20px; cursor: pointer; margin-left: 8px; transition: color 0.2s; }
        .delete-btn:hover { color: #b71c1c; }
        .empty-msg { text-align: center; color: #aaa; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Tasks</h2>
        <div class="status-bar">
            <span id="activeCount">Active: 0</span>
            <span id="completedCount">Completed: 0</span>
        </div>
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <div class="add-task-row">
            <input type="text" id="taskInput" placeholder="Enter task text...">
            <button id="addTaskBtn" disabled>Add task</button>
        </div>
        <ul class="tasks-list" id="tasksList"></ul>
        <div class="empty-msg" id="emptyMsg" style="display:none;">No tasks found.</div>
    </div>
    <script src="todo.js"></script>
</body>
</html>
